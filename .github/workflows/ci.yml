name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type and Astro checks
        run: npm run check
      - name: Data and contract tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Validate Workers bundle
        run: npx wrangler deploy --dry-run
