name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type and Astro checks
        run: npm run check
      - name: Data and contract tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload static preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: static-preview
          path: dist
          retention-days: 1
      - name: Validate Workers bundle
        run: npx wrangler deploy --dry-run
